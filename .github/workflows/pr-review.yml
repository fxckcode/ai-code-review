name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Code Review
        uses: ./
        with:
          # Smoke / default agent: OpenCode (uses OPENAI_API_KEY via remap).
          agent: opencode
        env:
          AI_REVIEW_GITHUB_TOKEN: ${{ secrets.AI_REVIEW_GITHUB_TOKEN }}
          AI_REVIEW_CLAUDE_TOKEN: ${{ secrets.AI_REVIEW_CLAUDE_TOKEN }}
          # Prefer dedicated secret; fall back to existing OPENAI_API_KEY for smoke.
          AI_REVIEW_OPENCODE_TOKEN: ${{ secrets.AI_REVIEW_OPENCODE_TOKEN || secrets.OPENAI_API_KEY }}
          AI_REVIEW_CURSOR_TOKEN: ${{ secrets.AI_REVIEW_CURSOR_TOKEN }}
          AI_REVIEW_ANTIGRAVITY_TOKEN: ${{ secrets.AI_REVIEW_ANTIGRAVITY_TOKEN }}
          AI_REVIEW_MODEL: ${{ secrets.AI_REVIEW_MODEL }}
          AI_REVIEW_DEBUG: ${{ vars.AI_REVIEW_DEBUG }}
